services:
  fire-airhockey:
    build: .
    # Host port comes from .env (PORT=...); the container always listens
    # on its internal 8080. Copy .env.example to .env to customize.
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      # Public site origin used for absolute SEO tags (og:image, og:url,
      # canonical). Set DOMAIN=https://example.com in .env; when empty the
      # server falls back to the request Host.
      DOMAIN: ${DOMAIN:-}
    restart: unless-stopped
    # Least privilege: read-only filesystem, no new privileges, no
    # capabilities (the server only needs stdout and its high port).
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
